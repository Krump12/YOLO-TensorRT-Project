<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="historyTitle">Detection History</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body data-page="detections">
    <nav class="topbar">
      <a class="brand" href="/dashboard">YOLO TensorRT</a>
      <a class="nav-link" href="/dashboard" data-i18n="dashboard">Dashboard</a>
      <a class="nav-link active" href="/detections" data-i18n="history">History</a>
      <a class="nav-link" href="/analysis" data-i18n="analysis">Analysis</a>
      <a class="nav-link" href="/chat" data-i18n="chat">Q&A</a>
      <div class="language-switcher">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">English</button>
      </div>
      <form method="post" action="/logout" class="logout-form">
        <button type="submit" data-i18n="logout">Logout</button>
      </form>
    </nav>
    <main class="page">
      <header class="section-header">
        <h1 data-i18n="historyTitle">Detection History</h1>
        <p id="snapshot-meta" data-i18n="historySubtitle">Recent target detections from the latest 48 hours.</p>
      </header>
      <section class="filters">
        <label><span data-i18n="classFilter">Class filter</span><input id="class-filter" placeholder="class"></label>
        <label><span data-i18n="minConfidence">Min confidence</span><input id="confidence-filter" type="number" min="0" max="1" step="0.01" value="0"></label>
        <button id="apply-detection-filters" type="button" data-i18n="apply">Apply</button>
      </section>
      <div id="empty-state" class="empty-state" data-i18n="noHistory">No target detections in the latest 48 hours.</div>
      <table class="detections-table" aria-label="Recent detections">
        <thead>
          <tr>
            <th data-i18n="class">Class</th>
            <th data-i18n="confidence">Confidence</th>
            <th data-i18n="bbox">Bounding box</th>
            <th data-i18n="timestamp">Timestamp</th>
            <th data-i18n="details">Details</th>
          </tr>
        </thead>
        <tbody id="detections-body"></tbody>
      </table>
      <aside id="detection-detail" class="detail-panel" hidden></aside>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
