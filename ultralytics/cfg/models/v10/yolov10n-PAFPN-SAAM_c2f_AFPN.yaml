# Parameters
nc: 20 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2      0      320x320x64
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4     1      160x160x128
  - [-1, 3, C2f, [128, True]]              #2      160x160x128
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8     3      80 x80 x256
  - [-1, 6, C2f, [256, True]]              #4      80 x80 x256
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16  5      40x40x512
  - [-1, 6, C2f, [512, True]]              #6      40x40x512
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32 7      20X20x1024
  - [-1, 3, C2f, [1024, True]]             #8      20X20x1024
  - [-1, 1, SPPF, [1024, 5]] # 9            9      20X20x1024
  - [-1, 1, PSA, [1024]] # 10              10      20X20x1024

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 19 (P4/16-medium)

  - [-1, 1, SCDown, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2fCIB, [1024, True, True]] # 22 (P5/32-large)

  - [16, 1, SAAM, [256]]                        #23   11
  - [19, 1, SAAM, [512]]                        #24   12

  - [23, 1, SCDown, [256, 3, 2]]               #25    13
  - [24, 1, nn.Upsample, [None, 2, "nearest"]] #26    14

  - [[23, 26], 1, CRMSFF_2, [64, 128]]         #15     27
  - [[24, 25], 1, CRMSFF_2, [128, 64]]         #16     28
  - [22, 3, C2f, [1024, True]]                 #17     29

  - [27, 1, SCDown, [768, 3, 2]]               #18     30
  - [-1, 1, SCDown, [768, 3, 2]]               #19     31
  - [28, 1, nn.Upsample, [None, 2, "nearest"]] #20     32
  - [28, 1, SCDown, [768, 3, 2]]               #21     33
  - [29, 1, nn.Upsample, [None, 2, "nearest"]] #22     34
  - [29, 1, nn.Upsample, [None, 4, "nearest"]] #23     35

  - [[27, 32, 35], 1, CRMSFF_3, [192, 192, 256]]  #24  36
  - [[28, 30, 34], 1, CRMSFF_3, [192, 192, 256]]  #25  37
  - [[29, 31, 33], 1, CRMSFF_3, [256, 192, 192]]  #26  38

  - [36, 1, Conv, [256, 1, 1]]                    #27  39
  - [37, 1, Conv, [512, 1, 1]]                    #28  40
  - [38, 1, Conv, [1024, 1, 1]]                   #29  41

  - [[39, 40, 41], 1, v10Detect, [nc]] # Detect(P3, P4, P5)
