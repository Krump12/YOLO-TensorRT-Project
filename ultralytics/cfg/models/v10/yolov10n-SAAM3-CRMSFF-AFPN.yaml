# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2      0
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4     1
  - [-1, 3, C2f, [128, True]]              #2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8     3
  - [-1, 6, C2f, [256, True]]              #4
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16  5
  - [-1, 6, C2f, [512, True]]              #6
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32 7
  - [-1, 3, C2f, [1024, True]]             #8
  - [-1, 1, SPPF, [1024, 5]] # 9            9
  - [-1, 1, SAAM, [1024]] # 10              10

# YOLOv8.0n head
head:
  - [4, 1, SAAM, [256]]                        #11
  - [6, 1, SAAM, [512]]                        #12

  - [11, 1, SCDown, [256, 3, 2]]               #13
  - [12, 1, nn.Upsample, [None, 2, "nearest"]] #14

  - [[11, 14], 1, CRMSFF_2, [64, 128]]         #15
  - [[12, 13], 1, CRMSFF_2, [128, 64]]         #16
  #- [10, 3, C2f, [1024, True]]                 #17

  - [15, 1, SCDown, [768, 3, 2]]               #18
  - [-1, 1, SCDown, [768, 3, 2]]               #19
  - [16, 1, nn.Upsample, [None, 2, "nearest"]] #20
  - [16, 1, SCDown, [768, 3, 2]]               #21
  - [10, 1, nn.Upsample, [None, 2, "nearest"]] #22
  - [10, 1, nn.Upsample, [None, 4, "nearest"]] #23

  - [[15, 19, 22], 1, CRMSFF_3, [192, 192, 256]]  #24
  - [[16, 17, 21], 1, CRMSFF_3, [192, 192, 256]]  #25
  - [[10, 18, 20], 1, CRMSFF_3, [256, 192, 192]]  #26

  - [23, 1, Conv, [256, 1, 1]]                    #27
  - [24, 1, Conv, [512, 1, 1]]                    #28
  - [25, 1, Conv, [1024, 1, 1]]                   #29

  - [[26, 27, 28], 1, v10Detect, [nc]] # Detect(P3, P4, P5)
