# Parameters
nc: 20 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2      0      320x320x64
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4     1      160x160x128
  - [-1, 3, C2f, [128, True]]              #2      160x160x128
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8     3      80 x80 x256
  - [-1, 6, C2f, [256, True]]              #4      80 x80 x256
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16  5      40x40x512
  - [-1, 6, C2f, [512, True]]              #6      40x40x512
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32 7      20X20x1024
  - [-1, 3, C2f, [1024, True]]             #8      20X20x1024
  - [-1, 1, SPPF, [1024, 5]] # 9            9      20X20x1024
  - [-1, 1, PSA, [1024]] # 10              10      20X20x1024

# YOLOv8.0n head
head:
  - [[-1, 8], 1, CRMSFF_2, [256, 256]]               #11
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         #12
  - [[-1, 6], 1, CRMSFF_2, [512, 128]]                #13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         #14
  - [[-1, 4], 1, CRMSFF_2, [640, 64]]                #15
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         #16

  - [[-1, 2], 1, CRMSFF_2, [704, 32]]                #17
  - [-1, 1, SCDown, [1024, 3, 2]]                      #18
  - [[-1, 15, 4], 1, CRMSFF_3, [256, 704, 64]]         #19
  - [-1, 1, SCDown, [1024, 3, 2]]                      #20
  - [[-1, 13, 6], 1, CRMSFF_3, [256, 640, 128]]         #21
  - [-1, 1, SCDown, [1024, 3, 2]]                      #22
  - [[-1, 11, 8], 1, CRMSFF_3, [256, 512, 256]]         #23

  - [19, 1, Conv, [256, 1, 1]]                    #24
  - [21, 1, Conv, [512, 1, 1]]                    #25
  - [23, 1, Conv, [1024, 1, 1]]                   #26

  - [[24, 25, 26], 1, v10Detect, [nc]] # Detect(P3, P4, P5)
